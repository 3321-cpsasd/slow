name: CI and ECS deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: PYTHONPATH=apps/api pytest -q apps/api/tests

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm build

  publish-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - api-tests
      - web-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - api
          - web
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-production:
    # Publishing an image is safe on main; changing the live service requires an
    # explicit repository/environment variable to avoid accidental deployments.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs:
      - publish-images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_PORT: ${{ secrets.ECS_PORT }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$HOME/.ssh/ecs_key"
          chmod 600 "$HOME/.ssh/ecs_key"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload deployment definition
        shell: bash
        run: |
          scp -P "$ECS_PORT" -i "$HOME/.ssh/ecs_key" \
            deploy/compose.prod.yml \
            "$ECS_USER@$ECS_HOST:/opt/slow/compose.prod.yml"
          scp -P "$ECS_PORT" -i "$HOME/.ssh/ecs_key" \
            deploy/scripts/remote-deploy.sh \
            "$ECS_USER@$ECS_HOST:/opt/slow/remote-deploy.sh"
      - name: Pull and deploy release
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$ECS_PORT" -i "$HOME/.ssh/ecs_key" \
            "$ECS_USER@$ECS_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -p "$ECS_PORT" -i "$HOME/.ssh/ecs_key" \
            "$ECS_USER@$ECS_HOST" \
            "chmod 700 /opt/slow/remote-deploy.sh && APP_VERSION='$GITHUB_SHA' REGISTRY='ghcr.io' IMAGE_NAME='$GITHUB_REPOSITORY' WEB_ORIGIN='$WEB_ORIGIN' /opt/slow/remote-deploy.sh"

  deploy-ecs-demo:
    # The mainland ECS currently runs the explicit local-login demo. Build on
    # the host with domestic package mirrors because GHCR pulls are unreliable.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_ECS_DEMO_DEPLOY == 'true' && vars.ENABLE_PRODUCTION_DEPLOY != 'true'
    needs:
      - api-tests
      - web-build
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_PORT: ${{ secrets.ECS_PORT }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$HOME/.ssh/ecs_key"
          chmod 600 "$HOME/.ssh/ecs_key"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy verified main commit on ECS
        shell: bash
        run: |
          ssh -p "$ECS_PORT" -i "$HOME/.ssh/ecs_key" \
            "$ECS_USER@$ECS_HOST" \
            "deploy $GITHUB_SHA"

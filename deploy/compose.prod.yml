name: slow

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slow}
      POSTGRES_USER: ${POSTGRES_USER:-slow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 1m
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

  api:
    image: ${REGISTRY}/${IMAGE_NAME}-api:${APP_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-slow}
      ATTACHMENT_STORAGE_DIR: /data/attachments
      RUNTIME_AI_CONFIG_PATH: /data/runtime-ai.json
      PASSWORD_ESCROW_PATH: /data/password-escrow.json
      WEB_ORIGIN: ${WEB_ORIGIN}
      APP_MODE: production
      AUTH_MODE: ${AUTH_MODE:-password}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 1200m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

  web:
    image: ${REGISTRY}/${IMAGE_NAME}-web:${APP_VERSION}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

networks:
  app:
    driver: bridge

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slow · 龟兔学习模式弹窗</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18352b;
      --muted: #6e7b74;
      --line: #dce3dd;
      --paper: #fffdf8;
      --canvas: #f2f4ef;
      --forest: #2c735f;
      --forest-deep: #194b3e;
      --forest-wash: #e8f2ed;
      --lime: #bac945;
      --hare: #d98d40;
      --hare-deep: #a95a29;
      --hare-wash: #fbefe1;
      --sans: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Songti SC", STSong, SimSun, Georgia, serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(186, 201, 69, .7); outline-offset: 3px; }

    .demo-page { min-height: 100vh; }
    .app-header {
      height: 64px;
      padding: 0 clamp(20px, 5vw, 64px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 252, .92);
    }
    .brand { display: flex; align-items: center; color: var(--forest); }
    .brand-logo { width: 108px; height: 38px; display: block; object-fit: contain; }
    .header-status { position: relative; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; }
    .expiry-trigger {
      padding: 7px 2px;
      border: 0;
      border-bottom: 1px dashed #a8b2aa;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .expiry-trigger:hover { color: var(--forest); border-bottom-color: var(--forest); }
    .expiry-trigger:disabled { border-bottom-color: transparent; cursor: default; }
    .mode-pill {
      min-width: 68px;
      padding: 7px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--forest);
      cursor: pointer;
      font-size: 10px;
      font-weight: 780;
      transition: color .16s ease, border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .mode-pill::after { content: "↔"; font: 700 9px/1 var(--mono); opacity: .5; }
    .mode-pill:hover { transform: translateY(-1px); background: #fafbf7; }
    .duration-popover {
      width: 292px;
      padding: 15px;
      position: absolute;
      z-index: 90;
      top: calc(100% + 12px);
      right: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 18px 48px rgba(20, 47, 35, .18);
      animation: popover-in .16s ease-out both;
    }
    .duration-popover[hidden] { display: none; }
    .duration-popover::before {
      content: "";
      width: 9px;
      height: 9px;
      position: absolute;
      top: -6px;
      right: 91px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      background: var(--paper);
      transform: rotate(45deg);
    }
    .duration-popover > span { display: block; color: var(--ink); font-size: 11px; font-weight: 760; }
    .duration-popover > small { margin-top: 9px; display: block; color: #7a857e; font-size: 9px; line-height: 1.45; }
    .duration-popover .duration-options { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); }
    .duration-popover .duration-button { min-width: 0; padding: 0 4px; }
    .page-main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 68px 0; }
    .page-main > small { color: var(--forest); font: 700 10px/1 var(--mono); letter-spacing: .14em; }
    .page-main h1 { max-width: 720px; margin: 16px 0 14px; font: 650 clamp(38px, 6vw, 66px)/1.08 var(--serif); letter-spacing: -.055em; }
    .page-main > p { max-width: 610px; margin: 0; color: var(--muted); line-height: 1.8; }
    .placeholder-grid { margin-top: 48px; display: grid; grid-template-columns: 1.4fr .8fr; gap: 18px; }
    .placeholder-card { min-height: 250px; padding: 26px; border: 1px solid var(--line); background: rgba(255, 255, 252, .72); }
    .placeholder-card:first-child { background: var(--forest-deep); color: white; }
    .placeholder-card span { opacity: .65; font: 700 9px/1 var(--mono); letter-spacing: .12em; }
    .placeholder-card h2 { max-width: 560px; margin: 58px 0 10px; font: 650 28px/1.25 var(--serif); }
    .placeholder-card p { margin: 0; opacity: .7; font-size: 12px; line-height: 1.7; }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(15, 27, 21, .62);
      backdrop-filter: blur(10px) saturate(.72);
      animation: backdrop-in .24s ease-out both;
    }
    .backdrop[hidden] { display: none; }
    .dialog {
      width: min(1060px, 100%);
      max-height: calc(100vh - 30px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 38px 120px rgba(10, 31, 21, .36);
      animation: dialog-in .36s cubic-bezier(.2, .82, .2, 1) both;
    }
    .dialog:focus { outline: none; }

    .dialog-header {
      padding: 25px 34px 20px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { margin: 0 0 8px; color: var(--forest); font: 750 9px/1 var(--mono); letter-spacing: .16em; }
    .dialog-header h2 { margin: 0; font: 650 clamp(30px, 3.6vw, 44px)/1.06 var(--serif); letter-spacing: -.045em; }

    .versus-arena {
      --fast-fill: transparent;
      --slow-fill: transparent;
      min-height: 330px;
      margin: 0;
      padding: 0 34px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .versus-arena::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: -13% -10%;
      background: linear-gradient(90deg,
        var(--fast-fill) 0 50%,
        var(--slow-fill) 50% 100%
      );
      transform: rotate(9deg);
      pointer-events: none;
    }
    .versus-arena:has(.fast:hover)::before,
    .versus-arena:has(.fast.selected)::before { --fast-fill: var(--hare-wash); }
    .versus-arena:has(.deep:hover)::before,
    .versus-arena:has(.deep.selected)::before { --slow-fill: var(--forest-wash); }
    .versus-line {
      width: 9px;
      position: absolute;
      z-index: 3;
      top: -13%;
      bottom: -13%;
      left: 50%;
      transform: translateX(-50%) rotate(9deg);
      background: linear-gradient(90deg,
        transparent 0 2px,
        rgba(255, 253, 248, .96) 2px 3px,
        var(--ink) 3px 5px,
        var(--lime) 5px 6px,
        rgba(255, 253, 248, .96) 6px 7px,
        transparent 7px 9px
      );
      filter: drop-shadow(0 0 5px rgba(24, 53, 43, .12));
      pointer-events: none;
    }
    .versus-badge {
      width: 54px;
      height: 54px;
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 5px solid var(--paper);
      border-radius: 50%;
      background: var(--ink);
      color: white;
      box-shadow: 0 8px 20px rgba(24, 53, 43, .2);
      font: 850 13px/1 var(--mono);
      letter-spacing: -.06em;
      pointer-events: none;
    }
    .mode-fighter {
      min-width: 0;
      padding: 22px 36px 21px;
      position: relative;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .2s ease;
      z-index: 1;
    }
    .mode-fighter.fast { --fighter: var(--hare); --fighter-deep: var(--hare-deep); --fighter-wash: var(--hare-wash); padding-left: 18px; padding-right: 52px; }
    .mode-fighter.deep { --fighter: var(--forest); --fighter-deep: var(--forest-deep); --fighter-wash: var(--forest-wash); padding-left: 52px; padding-right: 18px; }
    .mode-fighter.fast:hover,
    .mode-fighter.fast.selected,
    .mode-fighter.deep:hover,
    .mode-fighter.deep.selected { background: transparent; }
    .mode-fighter:focus-visible { outline: none; }
    .mode-fighter:focus-visible .radio-mark { box-shadow: 0 0 0 4px rgba(186, 201, 69, .34); }
    .mode-fighter::after {
      content: "";
      width: 170px;
      height: 170px;
      position: absolute;
      right: -86px;
      top: -93px;
      border: 24px solid var(--fighter);
      border-radius: 50%;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .mode-fighter.deep::after { right: auto; left: -86px; }
    .mode-fighter.selected::after { opacity: .09; }
    .fighter-top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .mode-code { color: var(--fighter-deep); font: 850 12px/1 var(--mono); letter-spacing: .15em; }
    .radio-mark { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #aab3ac; border-radius: 50%; background: white; }
    .selected .radio-mark { border-color: var(--fighter-deep); }
    .selected .radio-mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--fighter-deep); }

    .mascot-stage {
      height: 138px;
      margin-top: 3px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .mascot-stage::after {
      content: "";
      width: min(260px, 78%);
      height: 1px;
      position: absolute;
      bottom: 8px;
      background: var(--fighter);
      opacity: .22;
    }
    .mascot {
      width: 180px;
      height: 135px;
      overflow: visible;
      color: var(--fighter-deep);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1);
    }
    .fast:hover .mascot, .fast.selected .mascot { transform: translateX(7px) rotate(-2deg); }
    .deep:hover .mascot, .deep.selected .mascot { transform: translateX(3px); }
    .speed-line { stroke: var(--fighter); stroke-width: 5; stroke-linecap: round; opacity: .28; }
    .animal-fill { fill: var(--fighter); }
    .animal-dark { fill: var(--fighter-deep); }
    .animal-paper { fill: var(--paper); }
    .animal-stroke { fill: none; stroke: var(--fighter-deep); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

    .fighter-copy { position: relative; z-index: 1; text-align: center; }
    .mode-details {
      max-width: 350px;
      margin: 2px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      text-align: left;
    }
    .mode-details small { display: block; color: #7b867f; font-size: 8px; font-weight: 700; letter-spacing: .08em; }
    .use-case span { margin-top: 4px; display: block; color: #59675f; font-size: 10px; line-height: 1.45; }
    .study-time { padding-left: 14px; border-left: 1px solid color-mix(in srgb, var(--fighter), transparent 70%); white-space: nowrap; }
    .study-time b { margin-top: 3px; display: block; color: var(--fighter-deep); font: 760 18px/1.15 var(--serif); letter-spacing: -.025em; }

    .mode-footer { border-top: 1px solid var(--line); background: #fafbf7; }
    .duration-section { padding: 18px 34px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
    .duration-section > label { color: #45534a; font-size: 11px; font-weight: 760; }
    .duration-options { display: flex; gap: 7px; }
    .duration-button {
      min-width: 72px;
      height: 35px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: #626d65;
      cursor: pointer;
      font-size: 10px;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }
    .duration-button:hover { border-color: #8c9a90; }
    .duration-button.selected { border-color: var(--forest-deep); background: var(--forest-deep); color: white; }
    .expiry { color: #68766e; font: 700 9px/1.4 var(--mono); text-align: right; }
    .footer-action { padding: 0 34px 22px; display: flex; justify-content: flex-end; }
    .start-button {
      min-width: 260px;
      min-height: 46px;
      padding: 0 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 0;
      border-radius: 5px;
      background: var(--forest-deep);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 780;
      transition: transform .18s ease, background .18s ease;
    }
    .start-button:not(:disabled):hover { transform: translateY(-1px); background: #103b30; }
    .start-button span { color: var(--lime); font-size: 17px; }
    .start-button:disabled { background: #d7ddd8; color: #88918b; cursor: not-allowed; }
    .start-button:disabled span { color: #a7afa9; }

    .toast {
      max-width: calc(100% - 32px);
      padding: 12px 16px;
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 80;
      transform: translate(-50%, 16px);
      border-radius: 5px;
      background: var(--forest-deep);
      color: white;
      box-shadow: 0 16px 40px rgba(13, 36, 26, .26);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    @keyframes backdrop-in { from { opacity: 0; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(16px) scale(.985); } }
    @keyframes popover-in { from { opacity: 0; transform: translateY(-5px); } }

    @media (max-width: 640px) {
      .header-status > span:first-child { display: none; }
      .page-main { padding-top: 38px; }
      .placeholder-grid { grid-template-columns: 1fr; }
      .backdrop { padding: 8px; align-items: end; }
      .dialog { max-height: calc(100vh - 16px); border-radius: 16px 16px 0 0; }
      .dialog-header { padding: 22px 21px 18px; }
      .versus-arena { padding: 0 21px; grid-template-columns: 1fr; }
      .versus-arena::before {
        inset: -10% -13%;
        background: linear-gradient(180deg,
          var(--fast-fill) 0 50%,
          var(--slow-fill) 50% 100%
        );
        transform: rotate(-3deg);
      }
      .versus-line {
        width: auto;
        height: 7px;
        top: 50%;
        right: 10px;
        bottom: auto;
        left: 10px;
        transform: translateY(-50%) rotate(-3deg);
        background: linear-gradient(180deg,
          transparent 0 1px,
          rgba(255, 253, 248, .96) 1px 2px,
          var(--ink) 2px 4px,
          var(--lime) 4px 5px,
          rgba(255, 253, 248, .96) 5px 6px,
          transparent 6px 7px
        );
      }
      .versus-badge { top: 50%; }
      .mode-fighter.fast, .mode-fighter.deep { padding: 17px 16px 28px; }
      .mode-fighter.deep { padding-top: 29px; padding-bottom: 18px; }
      .mode-fighter.deep::after { left: auto; right: -86px; }
      .mascot-stage { height: 112px; }
      .mascot { width: 150px; height: 110px; }
      .duration-section { padding: 18px 21px 13px; grid-template-columns: 1fr; gap: 10px; }
      .duration-options { display: grid; grid-template-columns: repeat(4, 1fr); }
      .duration-button { min-width: 0; padding: 0 4px; }
      .expiry { text-align: left; }
      .footer-action { padding: 0 21px 21px; }
      .start-button { width: 100%; min-width: 0; }
    }

    @media (max-width: 420px) {
      .mode-details { gap: 10px; }
      .study-time { padding-left: 10px; }
      .study-time b { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="demo-page" aria-hidden="true">
    <header class="app-header">
      <div class="brand"><img class="brand-logo" src="../apps/web/public/slow-logo.svg" alt="Slow" /></div>
      <div class="header-status">
        <button class="expiry-trigger" id="headerCopy" type="button" disabled aria-haspopup="dialog" aria-expanded="false">本次学习模式尚未设置</button>
        <button class="mode-pill" id="modePill" type="button" aria-label="选择学习模式">未选择</button>
        <div class="duration-popover" id="durationPopover" role="dialog" aria-label="调整模式持续时间" hidden>
          <span>保持当前模式</span>
          <div class="duration-options" role="radiogroup" aria-label="新的持续时间">
            <button class="duration-button selected" type="button" role="radio" aria-checked="true" data-duration="1">1 小时</button>
            <button class="duration-button" type="button" role="radio" aria-checked="false" data-duration="3">3 小时</button>
            <button class="duration-button" type="button" role="radio" aria-checked="false" data-duration="6">6 小时</button>
            <button class="duration-button" type="button" role="radio" aria-checked="false" data-duration="today">今天</button>
          </div>
          <small>选择后从现在重新计算有效期，不打断当前活动。</small>
        </div>
      </div>
    </header>
    <main class="page-main">
      <small>YOUR LEARNING SHELF</small>
      <h1>继续把知识，学成自己的。</h1>
      <p>长期目标决定最终抵达哪里；本次学习模式，只决定此刻用什么节奏前进。</p>
      <div class="placeholder-grid">
        <article class="placeholder-card"><span>今日继续</span><h2>为什么有索引，查询仍然可能很慢？</h2><p>第 1 本 · 查询如何发生 · 预计 20 分钟</p></article>
        <article class="placeholder-card"><span>长期目标</span><h2>能够独立定位并优化数据库慢查询</h2><p>掌握路径 · 当前进度 36%</p></article>
      </div>
    </main>
  </div>

  <div class="backdrop" id="modeBackdrop">
    <section class="dialog" id="modeDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">
      <header class="dialog-header">
        <div>
          <p class="eyebrow">CHOOSE YOUR PACE</p>
          <h2 id="dialogTitle">这次，跟谁一起出发？</h2>
        </div>
      </header>

      <div class="versus-arena" role="radiogroup" aria-label="学习模式">
        <span class="versus-line" aria-hidden="true"></span>
        <span class="versus-badge" aria-hidden="true">VS</span>

        <button class="mode-fighter fast" type="button" role="radio" aria-checked="false" data-mode="fast">
          <span class="fighter-top">
            <span class="mode-code">FAST</span>
            <span class="radio-mark" aria-hidden="true"></span>
          </span>
          <span class="mascot-stage" aria-hidden="true">
            <svg class="mascot hare-icon" viewBox="0 0 240 180">
              <path class="speed-line" d="M12 81h44M22 101h31M38 121h28" />
              <ellipse class="animal-fill" cx="132" cy="118" rx="60" ry="39" transform="rotate(-8 132 118)" />
              <circle class="animal-fill" cx="179" cy="78" r="32" />
              <path class="animal-fill" d="M164 53c-15-31-12-51-1-52 14-1 22 26 23 51z" />
              <path class="animal-dark" d="M186 51c1-34 11-50 22-46 13 5 3 34-8 55z" />
              <circle class="animal-paper" cx="190" cy="74" r="4.5" />
              <circle class="animal-dark" cx="218" cy="84" r="5" />
              <circle class="animal-paper" cx="83" cy="107" r="18" />
              <path class="animal-dark" d="M113 145c-28 1-50 8-52 20h80c5-12-6-20-28-20zM158 142c-4 13 5 22 30 25h37c-3-15-24-23-67-25z" />
            </svg>
          </span>
          <span class="fighter-copy">
            <span class="mode-details">
              <span class="use-case"><small>适合</small><span>通勤 · 户外 · 碎片时间</span></span>
              <span class="study-time"><small>单节约</small><b>3–5 分钟</b></span>
            </span>
          </span>
        </button>

        <button class="mode-fighter deep" type="button" role="radio" aria-checked="false" data-mode="slow">
          <span class="fighter-top">
            <span class="mode-code">SLOW</span>
            <span class="radio-mark" aria-hidden="true"></span>
          </span>
          <span class="mascot-stage" aria-hidden="true">
            <svg class="mascot turtle-icon" viewBox="0 0 240 180">
              <path class="speed-line" d="M22 145h194" />
              <ellipse class="animal-fill" cx="121" cy="102" rx="71" ry="50" />
              <path class="animal-dark" d="M59 101c7-33 30-52 62-52 34 0 58 20 67 53z" />
              <path class="animal-stroke" style="stroke:var(--fighter);stroke-width:4" d="M84 67l37 35 34-37M76 102h90M121 53v49" />
              <circle class="animal-fill" cx="195" cy="108" r="25" />
              <circle class="animal-paper" cx="203" cy="102" r="4" />
              <path class="animal-dark" d="M56 128c-24 2-35 11-32 25h50c7-13 1-22-18-25zM159 132c-4 13 5 21 28 21h32c0-13-20-21-60-21z" />
              <path class="animal-fill" d="M54 97 31 111l25 7z" />
            </svg>
          </span>
          <span class="fighter-copy">
            <span class="mode-details">
              <span class="use-case"><small>适合</small><span>安静环境 · 时间完整 · 方便专注</span></span>
              <span class="study-time"><small>单节约</small><b>10–20 分钟</b></span>
            </span>
          </span>
        </button>
      </div>

      <footer class="mode-footer">
        <div class="duration-section">
          <label>保持这次选择</label>
          <div class="duration-options" role="radiogroup" aria-label="模式持续时间">
            <button class="duration-button selected" type="button" role="radio" aria-checked="true" data-duration="1">1 小时</button>
            <button class="duration-button" type="button" role="radio" aria-checked="false" data-duration="3">3 小时</button>
            <button class="duration-button" type="button" role="radio" aria-checked="false" data-duration="6">6 小时</button>
            <button class="duration-button" type="button" role="radio" aria-checked="false" data-duration="today">今天</button>
          </div>
          <span class="expiry" id="expiryPreview"></span>
        </div>
        <div class="footer-action">
          <button class="start-button" id="startButton" type="button" disabled>先选一位学习搭档 <span>→</span></button>
        </div>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const backdrop = document.getElementById('modeBackdrop');
      const modeCards = [...document.querySelectorAll('[data-mode]')];
      const durationButtons = [...document.querySelectorAll('[data-duration]')];
      const startButton = document.getElementById('startButton');
      const expiryPreview = document.getElementById('expiryPreview');
      const toast = document.getElementById('toast');
      const modePill = document.getElementById('modePill');
      const headerCopy = document.getElementById('headerCopy');
      const durationPopover = document.getElementById('durationPopover');
      const demoPage = document.querySelector('.demo-page');
      let selectedMode = '';
      let selectedDuration = '1';
      let toastTimer;

      const expiryFor = (duration) => {
        const date = new Date();
        if (duration === 'today') date.setHours(23, 59, 59, 999);
        else date.setHours(date.getHours() + Number(duration));
        return date;
      };

      const formatExpiry = (date) => {
        const formatter = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
        return `保持至今天 ${formatter.format(date)}`;
      };

      const updateExpiry = () => { expiryPreview.textContent = formatExpiry(expiryFor(selectedDuration)); };

      const selectMode = (mode) => {
        selectedMode = mode;
        modeCards.forEach((card) => {
          const selected = card.dataset.mode === mode;
          card.classList.toggle('selected', selected);
          card.setAttribute('aria-checked', String(selected));
        });
        const name = mode === 'fast' ? 'Fast' : 'Slow';
        const partner = mode === 'fast' ? '兔子' : '乌龟';
        startButton.disabled = false;
        startButton.innerHTML = `和${partner}以 ${name} 模式开始 <span>→</span>`;
      };

      const selectDuration = (duration) => {
        selectedDuration = duration;
        durationButtons.forEach((button) => {
          const selected = button.dataset.duration === duration;
          button.classList.toggle('selected', selected);
          button.setAttribute('aria-checked', String(selected));
        });
        updateExpiry();
      };

      const showToast = (message) => {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 2600);
      };

      const activateHeaderMode = (mode) => {
        const name = mode === 'fast' ? 'Fast' : 'Slow';
        const expiry = formatExpiry(expiryFor(selectedDuration)).replace('保持至', '');
        modePill.textContent = name;
        modePill.style.borderColor = mode === 'fast' ? 'var(--hare)' : 'var(--forest)';
        modePill.style.color = mode === 'fast' ? 'var(--hare-deep)' : 'var(--forest)';
        modePill.setAttribute('aria-label', `当前为 ${name}，点击切换为 ${mode === 'fast' ? 'Slow' : 'Fast'}`);
        headerCopy.textContent = `保持至${expiry}`;
        headerCopy.disabled = false;
        headerCopy.setAttribute('aria-label', `${headerCopy.textContent}，点击调整持续时间`);
        return { name, expiry };
      };

      const closeDurationPopover = () => {
        durationPopover.hidden = true;
        headerCopy.setAttribute('aria-expanded', 'false');
      };

      const moveWithinGroup = (event, items, currentIndex, onSelect) => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
        event.preventDefault();
        const direction = ['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : -1;
        const next = (currentIndex + direction + items.length) % items.length;
        items[next].focus();
        onSelect(items[next].dataset.mode || items[next].dataset.duration);
      };

      modeCards.forEach((card, index) => {
        card.addEventListener('click', () => selectMode(card.dataset.mode));
        card.addEventListener('keydown', (event) => moveWithinGroup(event, modeCards, index, selectMode));
      });
      durationButtons.forEach((button) => {
        button.addEventListener('click', () => {
          selectDuration(button.dataset.duration);
          if (selectedMode && backdrop.hidden) {
            const { name, expiry } = activateHeaderMode(selectedMode);
            closeDurationPopover();
            showToast(`${name} 模式已更新，将保持至${expiry}`);
          }
        });
        button.addEventListener('keydown', (event) => {
          const group = [...button.closest('.duration-options').querySelectorAll('[data-duration]')];
          moveWithinGroup(event, group, group.indexOf(button), selectDuration);
        });
      });

      startButton.addEventListener('click', () => {
        if (!selectedMode) return;
        const partner = selectedMode === 'fast' ? '兔子' : '乌龟';
        const { name, expiry } = activateHeaderMode(selectedMode);
        backdrop.hidden = true;
        document.body.style.overflow = '';
        demoPage.removeAttribute('aria-hidden');
        showToast(`${partner}已出发，${name} 模式将保持至${expiry}`);
      });

      modePill.addEventListener('click', () => {
        if (!selectedMode) return;
        closeDurationPopover();
        const nextMode = selectedMode === 'fast' ? 'slow' : 'fast';
        selectMode(nextMode);
        const partner = nextMode === 'fast' ? '兔子' : '乌龟';
        const { name, expiry } = activateHeaderMode(nextMode);
        showToast(`已切换为 ${name}，${partner}将在下一项活动加入 · 至${expiry}`);
      });

      headerCopy.addEventListener('click', () => {
        if (!selectedMode) return;
        durationPopover.hidden = !durationPopover.hidden;
        headerCopy.setAttribute('aria-expanded', String(!durationPopover.hidden));
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.header-status')) closeDurationPopover();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !durationPopover.hidden) {
          closeDurationPopover();
          headerCopy.focus();
          return;
        }
        if (event.key === 'Escape' && !backdrop.hidden) {
          showToast('请先选择兔子或乌龟');
          (selectedMode ? document.querySelector(`[data-mode="${selectedMode}"]`) : modeCards[0]).focus();
        }
      });

      updateExpiry();
      document.body.style.overflow = 'hidden';
      window.setTimeout(() => document.getElementById('modeDialog').focus(), 260);
    })();
  </script>
</body>
</html>

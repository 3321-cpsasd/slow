<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12382e" />
    <title>Slow 暂时无法连接</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background: #fbfcf9; color: #17352b; }
      main { width: min(100%, 360px); }
      i { width: 42px; height: 42px; display: block; border: 9px solid #12382e; border-right-color: #b8f23d; border-radius: 50%; transform: rotate(-20deg); }
      h1 { margin: 28px 0 10px; font-size: 26px; }
      p { margin: 0; color: #68716a; font-size: 15px; line-height: 1.7; }
      button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 10px; background: #12382e; color: #fff; font-size: 15px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <i aria-hidden="true"></i>
      <h1>暂时无法连接 Slow</h1>
      <p>请检查网络后重试。学习内容保存在服务端，不会因为这次连接中断而丢失。</p>
      <button type="button" onclick="window.location.href='https://slow.net.cn'">重新连接</button>
    </main>
  </body>
</html>
